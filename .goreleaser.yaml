version: 2

project_name: sloppy-toppy

before:
  hooks:
    - go mod tidy
    # Nothing else checked formatting, so an unformatted file shipped.
    # `gofmt -l` prints offenders and exits 0, so the output has to be turned
    # into the failure.
    - sh -c 'test -z "$(gofmt -l .)" || { echo "unformatted:"; gofmt -l .; exit 1; }'
    - go vet ./...
    - go test ./...

builds:
  - id: sloppy-toppy
    main: ./cmd/sloppy-toppy
    binary: sloppy-toppy
    env:
      # CGO_ENABLED=0 is the whole point of using modernc.org/sqlite instead
      # of a cgo binding: it keeps the binary fully static and lets every
      # target below cross-compile from one machine, with no build matrix
      # and no per-platform runner.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    # Named to match what `uname -s` / `uname -m` produce, so the documented
    # one-line install can be pasted verbatim. The previous template used
    # lowercase os, Go's arch spelling, and a version segment, none of which a
    # `latest/download/` URL built from uname can supply — every combination
    # 404'd. Keep this in lockstep with the README install command.
    name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "darwin" }}Darwin
      {{- else if eq .Os "linux" }}Linux
      {{- else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
